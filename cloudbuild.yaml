# TruckingGO — build, migrate, deploy to Cloud Run (TechnicalDocument.md §9.2).
#
#   gcloud builds submit --config cloudbuild.yaml .
#
# Every secret comes from Google Secret Manager. Nothing sensitive is committed,
# passed as a substitution, or baked into an image layer. Only the six NEXT_PUBLIC_*
# values (4 Firebase + the Maps Places key + the site URL) are build-time values —
# Next.js inlines them into the browser bundle, so they are public by design.
#
# GOOGLE_MAPS_SERVER_API_KEY is deliberately absent from availableSecrets: it is a
# runtime-only secret and must never enter an image layer.
#
# PUBLIC_SITE_URL is the odd one out: it is not sensitive at all — it is the app's
# own public origin. It lives in Secret Manager anyway so that every deploy-time
# value is configured in one place, and because Cloud Build has no other clean way
# to inject a per-environment value without committing it as a substitution.
#
# It MUST be delivered as a --build-arg, not via --set-secrets. NEXT_PUBLIC_* is
# inlined by the compiler during `next build`; mounting it at runtime would leave
# the baked-in fallback (http://localhost:3000) in the bundle and every OG and
# canonical URL would point at localhost.
#
# One-time project bootstrap (APIs, Artifact Registry, secrets, IAM): docs/gcp-setup.md

substitutions:
  _REGION: asia-south1
  _SERVICE: truckinggo
  _REPO: truckinggo

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_API_KEY/versions/latest
      env: NEXT_PUBLIC_FIREBASE_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_AUTH_DOMAIN/versions/latest
      env: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_PROJECT_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    - versionName: projects/${PROJECT_ID}/secrets/FIREBASE_APP_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_APP_ID
    - versionName: projects/${PROJECT_ID}/secrets/GOOGLE_MAPS_API_KEY/versions/latest
      env: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    # Not a secret — the app's own origin, e.g. https://truckinggo.example.com.
    # Stored here so the deployed value is configured alongside everything else.
    - versionName: projects/${PROJECT_ID}/secrets/PUBLIC_SITE_URL/versions/latest
      env: NEXT_PUBLIC_SITE_URL
    - versionName: projects/${PROJECT_ID}/secrets/DIRECT_URL/versions/latest
      env: DIRECT_URL

steps:
  # 1. Build. Only the public client keys cross into the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_FIREBASE_API_KEY
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID
      - NEXT_PUBLIC_FIREBASE_APP_ID
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
      - NEXT_PUBLIC_SITE_URL
    args:
      - -c
      - |
        set -e
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"
        docker build \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$$NEXT_PUBLIC_FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$$NEXT_PUBLIC_FIREBASE_APP_ID" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" \
          --build-arg NEXT_PUBLIC_SITE_URL="$$NEXT_PUBLIC_SITE_URL" \
          -t "$$IMAGE:$SHORT_SHA" -t "$$IMAGE:latest" .

  # 2. Push both tags.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - docker push --all-tags "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"

  # 3. Migrate BEFORE traffic shifts, over the unpooled connection.
  #    A pooler cannot run DDL reliably, so this uses DIRECT_URL.
  - id: migrate
    name: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
    entrypoint: sh
    secretEnv: [DIRECT_URL]
    # The runner image drops to USER nextjs (uid 1001), but Cloud Build points
    # HOME at /builder/home, which is root-owned — so npm's first act is to
    # mkdir /builder/home/.npm and fail with EACCES. Only /tmp is reliably
    # writable by an arbitrary uid inside a build step, so HOME and the npm
    # cache both go there. Nothing is persisted between steps anyway.
    env:
      - HOME=/tmp
      - npm_config_cache=/tmp/.npm
      - npm_config_update_notifier=false
    args:
      - -c
      - |
        set -e
        export DATABASE_URL="$$DIRECT_URL"
        # --yes because npx prompts before fetching a package it cannot resolve
        # locally, and there is no TTY here to answer it. The standalone output
        # only traces what the server imports, so the Prisma CLI is not in the
        # runtime image even though @prisma/client is.
        npx --yes prisma migrate deploy

  # 4. Deploy. Runtime secrets are mounted from Secret Manager — they never
  #    touch the build, the image, or this file.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --memory=512Mi
      - --cpu=1
      - --set-env-vars=NODE_ENV=production
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DIRECT_URL=DIRECT_URL:latest,FIREBASE_ADMIN_PROJECT_ID=FIREBASE_ADMIN_PROJECT_ID:latest,FIREBASE_ADMIN_CLIENT_EMAIL=FIREBASE_ADMIN_CLIENT_EMAIL:latest,FIREBASE_ADMIN_PRIVATE_KEY=FIREBASE_ADMIN_PRIVATE_KEY:latest,GOOGLE_MAPS_SERVER_API_KEY=GOOGLE_MAPS_SERVER_API_KEY:latest,CRON_SECRET=CRON_SECRET:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
